name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: tw

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - name: darwin-amd64
            os: macos-14
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - name: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Stage archive
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="threadwise-${{ matrix.name }}"
          mkdir -p "${archive_dir}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "${archive_dir}/${BIN_NAME}"
          cp README.md "${archive_dir}/README.md"
          cp docs/mvp-plan.md "${archive_dir}/MVP-PLAN.md"
          tar -czf "${archive_dir}.${{ matrix.archive_ext }}" "${archive_dir}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: threadwise-${{ matrix.name }}
          path: threadwise-${{ matrix.name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
